version: 2
registries:
  k9-rapid:
    type: maven-repository
    url: https://maven.pkg.github.com/navikt/k9-rapid
    username: x-access-token
    password: ${{secrets.READER_TOKEN}}
  ghcr:
    type: docker-registry
    url: ghcr.io
    username: x-access-token
    password: ${{secrets.READER_TOKEN}}
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      github:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude:
        - "no.nav.*"
    groups:
      gradle:
        patterns:
          - "*"
    registries:
      - k9-rapid

  - package-ecosystem: docker
    directory: "/"
      cooldown:
      #setter cooldown til 0 siden denne bare finner avhengigheter fra teamets egne bygg
      default-days: 0
    schedule:
      interval: daily
    registries:
      - ghcr
